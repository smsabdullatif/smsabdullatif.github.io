  <style>
/* Abdullatif — a quiet, editorial surface for work across the stack. */
:root {
  color-scheme: light;
  --bg: #f4f3ee;
  --surface: #fffefa;
  --surface-alt: #eaece9;
  --text: #111b24;
  --muted: #58666e;
  --line: #d6dcd9;
  --accent: #137ca6;
  --accent-soft: #e1f2f8;
  --visual: #101d27;
  --visual-line: #2a3c49;
  --visual-text: #f3f8fb;
  --cyan: #68c9f4;
  --radius: 16px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c141b;
  --surface: #111e28;
  --surface-alt: #182832;
  --text: #f0f3ee;
  --muted: #a4b2bb;
  --line: #293943;
  --accent: #77d1f7;
  --accent-soft: #183441;
  --visual: #0b1219;
  --visual-line: #263a47;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 100px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
svg { flex-shrink: 0; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
::selection { background: var(--cyan); color: #102431; }
[hidden] { display: none !important; }
.container, .nav-shell, .footer-shell { width: min(1240px, calc(100% - 96px)); margin-inline: auto; }
.page { min-height: 65vh; animation: page-in .35s ease both; }
.skip-link { position: fixed; inset-block-start: -80px; inset-inline-start: 20px; z-index: 1000; padding: 10px 18px; color: var(--bg); background: var(--text); }
.skip-link:focus { inset-block-start: 14px; }

/* Navigation */
.site-header { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line); background: var(--bg); }
@supports (backdrop-filter: blur(16px)) { .site-header { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); } }
.nav-shell { display: flex; align-items: center; min-height: 88px; gap: 36px; }
.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 750; font-size: 18px; letter-spacing: -.6px; white-space: nowrap; }
.brand-mark { display: inline-grid; place-items: center; width: 37px; height: 37px; border: 1px solid var(--text); font-family: var(--mono); font-size: 15px; letter-spacing: -2px; }
.brand span:last-child { font-family: var(--mono); }
.nav-links { display: flex; align-items: center; gap: 26px; margin-inline-start: auto; }
.nav-link { position: relative; padding-block: 12px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: color .18s ease; }
.nav-link:hover, .nav-link.active, .nav-link[aria-current="page"] { color: var(--text); }
.nav-link.active::after, .nav-link[aria-current="page"]::after { position: absolute; content: ""; width: 14px; height: 2px; bottom: 4px; inset-inline-start: 0; background: var(--accent); }
.header-controls { display: flex; align-items: center; gap: 9px; padding-inline-start: 25px; border-inline-start: 1px solid var(--line); }
.icon-button, .lang-button, .menu-button { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; background: transparent; font-size: 12px; font-family: var(--mono); transition: background .18s, border-color .18s; }
.icon-button svg, .menu-button svg { width: 17px; height: 17px; }
.icon-button:hover, .lang-button:hover, .menu-button:hover { border-color: var(--muted); background: var(--surface); }
.menu-button { display: none; }

/* First impression */
.hero { display: grid; grid-template-columns: 1.13fr 1fr; gap: 70px; align-items: center; padding-block: 92px 100px; }
.eyebrow { display: flex; align-items: center; gap: 10px; margin-block: 0 25px; color: var(--muted); font: 11px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1.9px; }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.hero-title { margin: 0 0 26px; max-width: 760px; font-size: clamp(52px, 6.3vw, 86px); line-height: 1.055; font-weight: 650; letter-spacing: -5.2px; }
.accent { color: var(--accent); }
.hero-title .accent { display: inline-block; }
.hero-description { max-width: 505px; color: var(--muted); font-size: 17px; line-height: 1.85; margin-block: 0 31px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 17px; min-height: 48px; padding: 12px 20px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; font-weight: 600; line-height: 1.4; transition: transform .18s, background .18s, border-color .18s; }
.button svg { width: 17px; height: 17px; }
.button:hover { transform: translateY(-2px); border-color: var(--muted); }
.button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.button.primary:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.button.secondary { background: transparent; }
.button.small { min-height: 38px; padding: 9px 14px; font-size: 12px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 23px; padding-block-start: 32px; color: var(--muted); font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1px; }
.hero-meta span { display: inline-flex; align-items: center; gap: 8px; }
.hero-meta svg { width: 13px; height: 13px; }

/* A purpose-built system portrait, rather than a stock hero image. */
.hero-visual { position: relative; min-height: 440px; overflow: hidden; color: var(--visual-text); border: 1px solid var(--visual-line); border-radius: var(--radius); background: var(--visual); direction: ltr; }
.visual-topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--visual-line); font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1px; color: #a1b1bd; }
.visual-topline span:last-child { color: var(--cyan); }
.code-orbit { position: relative; min-height: 310px; isolation: isolate; background-image: radial-gradient(#334956 1px, transparent 1px); background-size: 23px 23px; }
.code-orbit::before, .code-orbit::after { position: absolute; z-index: -1; content: ""; top: 50%; left: 50%; border: 1px solid #3b526040; border-radius: 50%; transform: translate(-50%, -50%) rotate(-18deg); width: 260px; height: 190px; }
.code-orbit::after { width: 340px; height: 245px; transform: translate(-50%, -50%) rotate(24deg); }
.code-mark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 114px; height: 114px; border: 1px solid #577b8d; border-radius: 24px; color: var(--cyan); background: #132b39; font: 700 51px/1 var(--mono); letter-spacing: -6px; box-shadow: 0 16px 55px #0004, inset 0 1px 0 #bfe4f51a; }
.orbit-node { position: absolute; display: flex; flex-direction: column; min-width: 98px; padding: 10px 13px; border: 1px solid #3b5262; border-radius: 7px; background: #152732; box-shadow: 0 7px 22px #0002; color: #dce8ee; font: 11px/1.7 var(--mono); }
.orbit-node small, .orbit-node span { display: block; color: #8fa4b1; font-size: 9px; }
.node-web { left: 7%; top: 33px; }
.node-api { right: 6%; top: 72px; }
.node-data { left: 10%; bottom: 46px; }
.node-mobile { right: 7%; bottom: 24px; }
.visual-footer { padding: 18px 24px 20px; border-top: 1px solid var(--visual-line); color: #9eafb9; font: 10px/1.8 var(--mono); }
.terminal-line { white-space: normal; overflow-wrap: anywhere; }
.terminal-line::before { content: "$ "; color: var(--cyan); }
.visual-footer strong { color: #d9e8ef; font-weight: 400; }

/* Section rhythm */
.section { padding-block: 82px; border-top: 1px solid var(--line); }
.section-head { display: grid; grid-template-columns: 1fr auto; gap: 14px 50px; align-items: end; margin-block-end: 36px; }
.section-head > div { min-width: 0; }
.section-index { display: block; margin-block: 0 13px; color: var(--accent); font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1.8px; }
.section-title { margin: 0; font-size: clamp(30px, 3.4vw, 46px); font-weight: 600; line-height: 1.18; letter-spacing: -1.7px; }
.section-description { max-width: 580px; margin-block: 16px 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
.text-link { display: inline-flex; align-items: center; gap: 12px; color: var(--text); border-bottom: 1px solid var(--text); padding-block: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.text-link:hover { color: var(--accent); border-color: var(--accent); }
.text-link svg { width: 16px; height: 16px; }
.page > .container > .section:first-child, .page > .section:first-child { border-top: 0; padding-block-start: 70px; }

/* Work is the visual proof. */
.project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 28px; }
.project-card { display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .25s, transform .25s; }
.project-card:hover { border-color: var(--muted); transform: translateY(-4px); }
.project-image { position: relative; display: block; aspect-ratio: 16/9; width: 100%; object-fit: cover; object-position: top; background: var(--surface-alt); border-bottom: 1px solid var(--line); overflow: hidden; }
.project-image img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .55s ease; }
.project-card:hover .project-image img { transform: scale(1.025); }
.project-placeholder { display: grid; place-items: center; min-height: 200px; color: var(--accent); background: var(--surface-alt); font-family: var(--mono); font-size: 36px; letter-spacing: -1px; }
.project-placeholder span { display: block; }
.project-content { display: flex; flex-direction: column; flex: 1; padding: 25px 27px 22px; }
.project-category { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-block: 0 12px; color: var(--muted); font: 9px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 1.3px; }
.project-number { color: var(--accent); font: 10px/1.5 var(--mono); }
.project-title { margin: 0 0 10px; font-size: 25px; line-height: 1.25; font-weight: 600; letter-spacing: -.8px; }
.project-title a:hover { color: var(--accent); }
.project-summary { margin: 0 0 22px; max-width: 58ch; color: var(--muted); font-size: 14px; line-height: 1.8; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-block: auto 23px; }
.tag { display: inline-flex; align-items: center; padding: 3px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 9px/1.7 var(--mono); }
.project-footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-block-start: 17px; border-top: 1px solid var(--line); }
.project-footer .text-link { border: 0; padding: 0; }
.project-status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 9px/1.5 var(--mono); }
.project-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 28px 35px; }
.filter-button { padding: 8px 15px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; line-height: 1.5; }
.filter-button.active, .filter-button:hover { color: var(--bg); background: var(--text); border-color: var(--text); }

/* Services and skills */
.services-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-inline-start: 1px solid var(--line); }
.service-card { position: relative; display: flex; flex-direction: column; min-height: 270px; padding: 29px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; transition: background .2s; }
.service-card:hover { background: var(--surface); }
.service-number { font: 10px/1.5 var(--mono); color: var(--muted); }
.service-icon { display: grid; place-items: center; width: 40px; height: 40px; margin-block: 20px 17px; color: var(--accent); border: 1px solid var(--line); border-radius: 7px; font: 16px/1 var(--mono); }
.service-icon svg { width: 22px; height: 22px; }
.service-card h3 { margin: 0 0 12px; font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -.5px; }
.service-card p { color: var(--muted); font-size: 13px; line-height: 1.8; margin: 0 0 16px; }
.service-card ul { padding-inline-start: 18px; color: var(--muted); font-size: 12px; }
.service-card .text-link { margin-block-start: auto; align-self: flex-start; }
.skills-layout { display: grid; grid-template-columns: .8fr 1.6fr; gap: 90px; }
.skills-intro .section-description { max-width: 300px; }
.skills-list { border-top: 1px solid var(--line); }
.skill-row { display: grid; grid-template-columns: 180px 1fr; gap: 20px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.skill-label { color: var(--text); font-size: 12px; font-weight: 600; }
.skill-values { color: var(--muted); font-size: 12px; line-height: 1.9; }
.skill-values .tag { margin: 0 5px 5px 0; }
.process-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px; }
.process-step { padding-block-start: 20px; border-top: 1px solid var(--line); }
.process-step > span, .process-step > small { color: var(--accent); font: 10px/1.5 var(--mono); }
.process-step h3 { margin: 18px 0 10px; font-size: 18px; line-height: 1.4; font-weight: 600; }
.process-step p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }

/* Contact and colophon */
.contact-panel { display: grid; grid-template-columns: 1.25fr .9fr; align-items: center; gap: 80px; padding: 56px; color: var(--visual-text); border: 1px solid var(--visual-line); border-radius: var(--radius); background: var(--visual); }
.contact-panel .section-index { color: var(--cyan); }
.contact-panel .section-title { max-width: 590px; font-size: clamp(35px, 4vw, 52px); }
.contact-panel p { max-width: 510px; color: #a9bac5; font-size: 14px; }
.contact-links { display: flex; flex-direction: column; }
.contact-link { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 19px; border-bottom: 1px solid #344753; color: #edf6fa; font-size: 14px; overflow-wrap: anywhere; }
.contact-link:first-child { border-top: 1px solid #344753; }
.contact-link:hover { color: var(--cyan); }
.contact-link svg { width: 18px; height: 18px; }
.contact-link small { display: block; color: #8eabba; font: 9px/1.8 var(--mono); text-transform: uppercase; letter-spacing: 1px; }
.contact-page { padding-block: 70px 110px; }
.site-footer { border-top: 1px solid var(--line); padding-block: 28px; }
.footer-shell { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; color: var(--muted); font: 10px/1.7 var(--mono); }
.footer-shell a:hover { color: var(--accent); }
.footer-links { display: flex; gap: 22px; }

/* Case study pages */
.project-detail { padding-block: 55px 90px; }
.detail-back { display: inline-flex; align-items: center; gap: 11px; color: var(--muted); font: 11px/1.5 var(--mono); margin-block-end: 50px; }
.detail-back:hover { color: var(--accent); }
.detail-back svg { width: 16px; height: 16px; }
.detail-hero { display: grid; grid-template-columns: 1.2fr .75fr; gap: 80px; padding-block-end: 48px; align-items: end; }
.detail-category { display: block; margin-block-end: 18px; color: var(--accent); font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1.5px; }
.detail-title { margin: 0 0 24px; font-size: clamp(40px, 5vw, 68px); font-weight: 600; line-height: 1.1; letter-spacing: -2.8px; }
.detail-summary { max-width: 740px; color: var(--muted); font-size: 17px; line-height: 1.85; }
.detail-meta { display: flex; flex-direction: column; gap: 22px; padding-inline-start: 30px; border-inline-start: 1px solid var(--line); }
.detail-meta h3, .detail-meta strong { margin: 0 0 8px; color: var(--muted); font: 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 1px; }
.detail-meta p { margin: 0; font-size: 13px; }
.detail-meta .tags { margin: 0; }
.detail-meta .hero-actions { gap: 8px; }
.detail-cover { width: 100%; max-height: 720px; object-fit: contain; object-position: top; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 12px; }
.detail-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 80px; row-gap: 40px; padding-block-start: 50px; }
.detail-section { min-width: 0; }
.detail-section h2 { margin: 0 0 18px; font-size: 25px; font-weight: 600; letter-spacing: -.8px; }
.detail-section p, .detail-section li { color: var(--muted); font-size: 14px; line-height: 1.9; }
.detail-section ul { padding-inline-start: 18px; }
.detail-section li + li { margin-block-start: 8px; }
.detail-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-block-start: 45px; }
.detail-gallery img { width: 100%; height: 100%; max-height: 600px; object-fit: contain; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 9px; }
.detail-gallery figure { margin: 0; }
.detail-gallery figcaption { padding-block: 10px; color: var(--muted); font: 10px/1.7 var(--mono); }
.project-note { padding: 16px 19px; margin-block: 25px; border-inline-start: 2px solid var(--accent); background: var(--accent-soft); color: var(--muted); font-size: 12px; }

/* Inspectable, browser-local systems demonstrations. */
.systems-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.system-panel { min-width: 0; overflow: hidden; padding: 26px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.system-panel h3 { margin: 0 0 10px; font-size: 20px; letter-spacing: -.5px; }
.system-panel > p { margin-block: 0 24px; color: var(--muted); font-size: 13px; line-height: 1.8; }
.system-panel.wide, .system-panel:last-child { grid-column: 1 / -1; }
.architecture { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding-block: 10px; }
.architecture-layer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 15px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: 12px/1.7 var(--mono); }
.architecture-layer small, .architecture-layer span { color: var(--muted); font-size: 10px; }
.flow-arrow { color: var(--accent); text-align: center; line-height: 1; font-size: 20px; }
.api-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 15px; direction: ltr; }
.method-badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font: 10px/1.5 var(--mono); }
.api-path { flex: 1; min-width: 120px; max-width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--text); font: 11px/1.5 var(--mono); padding: 9px; }
.api-button { padding: 9px 14px; border: 1px solid var(--text); border-radius: 5px; background: var(--text); color: var(--bg); font: 11px/1.5 var(--mono); }
.code-output, .terminal-output { display: block; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; padding: 22px; margin: 0; border: 1px solid var(--visual-line); border-radius: 7px; background: var(--visual); color: #c5e4f2; font: 11px/1.85 var(--mono); direction: ltr; text-align: left; tab-size: 2; }
.code-output { min-height: 250px; max-height: 440px; }
.terminal-window { overflow: hidden; margin-block-start: 24px; background: var(--visual); border: 1px solid var(--visual-line); border-radius: 7px; color: var(--visual-text); direction: ltr; }
.terminal-titlebar { padding: 12px 18px; border-bottom: 1px solid var(--visual-line); color: #91a8b6; font: 10px/1.5 var(--mono); }
.terminal-output { height: 275px; min-height: 200px; border: 0; border-radius: 0; padding-block-end: 10px; }
.terminal-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 22px 20px; }
.terminal-prompt { color: var(--cyan); font: 12px/1.5 var(--mono); white-space: nowrap; }

  function systemsPage() {
    const layers = [['clientLayer', 'React / Next.js / React Native'], ['apiLayer', 'Node.js / NestJS / REST / Auth'], ['dataLayer', 'PostgreSQL / MySQL / MongoDB'], ['deliveryLayer', 'Docker / Kubernetes / CI/CD']];
    return `<div class="page container">${pageIntro('systemsEyebrow', 'systemsTitle', 'systemsDescription')}<section class="section systems-grid"><article class="system-panel"><p class="eyebrow">${t('demoLabel')}</p><h2>${t('architectureTitle')}</h2><p>${t('architectureDescription')}</p><div class="architecture">${layers.map(([label, technologies], index) => `${index ? '<div class="flow-arrow" aria-hidden="true">↓</div>' : ''}<div class="architecture-layer"><strong>${t(label)}</strong><span dir="ltr">${technologies}</span></div>`).join('')}</div></article><article class="system-panel"><p class="eyebrow">${t('demoLabel')}</p><h2>${t('apiTitle')}</h2><p>${t('apiDescription')}</p><div class="api-toolbar"><span class="method-badge">GET</span><select id="endpoint-select" class="api-path" aria-label="${t('endpoint')}" dir="ltr"><option value="projects">/api/projects</option><option value="profile">/api/profile</option><option value="health">/api/health</option></select><button class="api-button" id="api-request" type="button">${t('runRequest')}</button></div><pre class="code-output" id="api-output" role="status" aria-label="${t('response')}" tabindex="0">${escapeHTML(t('responseHint'))}</pre></article><article class="system-panel terminal-panel"><p class="eyebrow">${t('demoLabel')}</p><h2>${t('terminalTitle')}</h2><p>${t('terminalDescription')}</p><div class="terminal-window" dir="ltr"><pre class="terminal-output" id="terminal-output" role="log" aria-live="polite" aria-label="${t('terminalLabel')}">${escapeHTML(t('terminalWelcome'))}</pre><form class="terminal-input-row" id="terminal-form"><span class="terminal-prompt" aria-hidden="true">visitor@abdullatif:~$</span><input id="terminal-input" class="terminal-input" type="text" maxlength="120" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="${t('terminalInput')}" placeholder="help"></form></div></article></section>${contactPanel()}</div>`;
  }
  function contactPage() {
    return `<div class="page container">${pageIntro('contactEyebrow', 'contactTitle', 'contactDescription')}<section class="section"><div class="contact-panel"><div><p class="section-index">${t('ctaEyebrow')}</p><h2 class="section-title">${t('name')}</h2><p>${t('role')}</p></div><div class="contact-links">${emailLink()}<a class="contact-link" href="${GITHUB}" target="_blank" rel="noopener noreferrer">${icon('github')}<span><small>GitHub / @smsabdullatif</small><span>${t('contactGitHubDescription')}</span></span>${icon('external')}</a></div></div></section></div>`;
  }
  function missingPage() {
    return `<div class="page container">${pageIntro('projectsEyebrow', 'notFoundTitle', 'notFoundDescription')}${routeLink('projects', t('allProjects'), 'button primary')}</div>`;
  }
  function closeMenu() {
    nav.classList.remove('open');
    menuButton.setAttribute('aria-expanded', 'false');
  }
  function updateChrome() {
    document.documentElement.lang = language;
    document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
    const skip = document.querySelector('.skip-link');
    if (skip) skip.textContent = t('skip');
    langButton.textContent = language === 'en' ? 'العربية' : 'English';
    langButton.setAttribute('aria-label', language === 'en' ? 'Switch to Arabic' : 'Switch to English');
    langButton.setAttribute('lang', language === 'en' ? 'ar' : 'en');
    themeButton.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
    themeButton.setAttribute('aria-label', t(theme === 'dark' ? 'lightTheme' : 'darkTheme'));
    themeButton.setAttribute('title', t(theme === 'dark' ? 'lightTheme' : 'darkTheme'));
    menuButton.setAttribute('aria-label', t('menu'));
    document.getElementById('site-footer').innerHTML = `<div class="container footer-shell"><p>© ${new Date().getFullYear()} Abdullatif</p><p>${t('footerNote')}</p><a href="${GITHUB}" target="_blank" rel="noopener noreferrer">GitHub ${icon('external')}</a></div>`;
  }
  function renderRoute({focus = true, scroll = true} = {}) {
    let route = location.hash.replace(/^#\/?/, '') || 'home';
    const [page, id] = route.split('/');
    currentRoute = ['home', 'projects', 'services', 'systems', 'contact', 'project'].includes(page) ? page : 'missing';
    const titleKey = {home:'role', projects:'navProjects', services:'navServices', systems:'navSystems', contact:'navContact', missing:'notFoundTitle'};
    const project = currentRoute === 'project' ? projects.find(item => item.id === id) : null;
    document.title = `${currentRoute === 'project' ? (project ? localized(project.title) : t('notFoundTitle')) : t(titleKey[currentRoute])} — Abdullatif`;
    const pages = {home:homePage, projects:projectsPage, services:servicesPage, systems:systemsPage, contact:contactPage, missing:missingPage};
    main.innerHTML = currentRoute === 'project' ? projectPage(id) : pages[currentRoute]();
    nav.querySelectorAll('[data-route]').forEach(link => {
      const active = link.dataset.route === (currentRoute === 'project' ? 'projects' : currentRoute);
      link.classList.toggle('active', active);
      if (active) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    });
    closeMenu();
    if (scroll) window.scrollTo({top:0, behavior:'instant'});
    if (focus) main.focus({preventScroll:true});
  }
  function toast(message) {
    const element = document.getElementById('toast');
    clearTimeout(toastTimer);
    element.textContent = message;
    element.hidden = false;
    toastTimer = setTimeout(() => { element.hidden = true; }, 2200);
  }
  // Deliberately local samples: this playground does not request a production API.
  function runAPI() {
    const endpoint = document.getElementById('endpoint-select').value;
    const samples = {
      projects: {demo:true, data:projects.slice(0, 4).map(project => ({id:project.id, name:localized(project.title), category:project.category, stack:project.stack.slice(0, 3)}))},
      profile: {demo:true, data:{name:'Abdullatif', role:'Software developer', areas:['web', 'backend', 'mobile', 'infrastructure'], github:GITHUB}},
      health: {demo:true, status:'ok', source:'local browser sample', services:[{name:'web', status:'ready'}, {name:'api', status:'ready'}, {name:'database', status:'ready'}]}
    };
    document.getElementById('api-output').textContent = JSON.stringify(samples[endpoint] || samples.projects, null, 2);
    toast(t('requestDone'));
  }
  // Bounded command interpreter, intentionally without eval or shell execution.
  function runTerminal(event) {
    event.preventDefault();
    const input = document.getElementById('terminal-input');
    const output = document.getElementById('terminal-output');
    const raw = input.value.trim().slice(0, 120);
    if (!raw) return;
    input.value = '';
    const command = raw.toLowerCase();
    if (command === 'clear') { output.textContent = ''; return; }
    const answers = {
      help: () => t('terminalHelp'), whoami: () => t('terminalWho'),
      skills: () => skills.map(([label, value]) => `${t(label)}: ${value}`).join('\n'),
      projects: () => projects.map(project => `• ${localized(project.title)} — ${localized(project.label)}`).join('\n'),
      contact: () => `${EMAIL}\n${GITHUB}`
    };
    const answer = Object.hasOwn(answers, command) ? answers[command]() : t('terminalUnknown');
    output.textContent = `${output.textContent}\n\n$ ${raw}\n${answer}`.split('\n').slice(-80).join('\n');
    output.scrollTop = output.scrollHeight;
  }

  main.addEventListener('click', event => {
    const filterButton = event.target.closest('[data-filter]');
    if (filterButton) {
      filter = filterButton.dataset.filter;
      main.querySelectorAll('[data-filter]').forEach(button => {
        const active = button.dataset.filter === filter;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      document.getElementById('project-results').innerHTML = filteredProjects();
    }
    if (event.target.closest('#api-request')) runAPI();
  });
  main.addEventListener('submit', event => { if (event.target.id === 'terminal-form') runTerminal(event); });
  langButton.addEventListener('click', () => {
    language = language === 'en' ? 'ar' : 'en';
    saveSetting('abdullatif-language', language);
    updateChrome();
    renderRoute({focus:false, scroll:false});
  });
  themeButton.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    saveSetting('abdullatif-theme', theme);
    updateChrome();
  });
  menuButton.addEventListener('click', () => {
    const open = menuButton.getAttribute('aria-expanded') !== 'true';
    nav.classList.toggle('open', open);
    menuButton.setAttribute('aria-expanded', String(open));
  });
  nav.addEventListener('click', event => { if (event.target.closest('a')) closeMenu(); });
  document.addEventListener('click', event => {
    if (event.target.closest('.skip-link')) { event.preventDefault(); main.focus(); }
    if (!event.target.closest('.nav-shell')) closeMenu();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') { closeMenu(); menuButton.focus(); }
  });
  window.addEventListener('hashchange', () => renderRoute());
  updateChrome();
  renderRoute({focus:false});
})();

</script>
</body>
</html>
